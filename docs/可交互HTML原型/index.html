<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>瞄一眼 · 可交互原型</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <!-- ================= 左侧：手机 ================= -->
  <div class="stage">
    <div class="stage-head">
      <div class="brand">
        <span class="dot"></span>
        <strong id="screenName">今天</strong>
        <span class="pid" id="screenPid">P02</span>
      </div>
      <div class="stage-tools">
        <button class="tool" id="darkToggle" title="切换深色模式">深色</button>
        <button class="tool" id="resetBtn" title="重置到初始状态">重置</button>
      </div>
    </div>

    <div class="phone" id="phone">
      <div class="notch"></div>
      <div class="statusbar" id="statusbar">
        <span class="time">9:41</span>
        <span class="right">
          <svg viewBox="0 0 24 24" class="ic-sig"><rect x="1" y="14" width="3" height="6" rx="1"/><rect x="5.5" y="11" width="3" height="9" rx="1"/><rect x="10" y="7.5" width="3" height="12.5" rx="1"/><rect x="14.5" y="4" width="3" height="16" rx="1" opacity=".35"/></svg>
          <svg viewBox="0 0 24 24" class="ic-wifi"><path d="M2 8.5a15 15 0 0 1 20 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M5.5 12.5a10 10 0 0 1 13 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M9 16.5a5 5 0 0 1 6 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="20" r="1.4"/></svg>
          <span class="batt"><i></i></span>
        </span>
      </div>
      <div class="screen" id="screen"></div>
      <div class="home-bar"></div>
    </div>

    <div class="hint" id="hint">点击屏幕上的按钮、卡片或底部导航进行交互</div>
  </div>

  <!-- ================= 右侧：说明面板 ================= -->
  <div class="panel">
    <div class="panel-block">
      <div class="panel-title">流程</div>
      <div class="flowlist" id="flowlist"></div>
    </div>

    <div class="panel-block">
      <div class="panel-title">本屏设计要点</div>
      <ul class="notes" id="notes"></ul>
    </div>

    <div class="panel-block">
      <div class="panel-title">全部页面</div>
      <div class="thumbs" id="thumbs"></div>
    </div>
  </div>

</div>

<!-- 状态提示气泡 -->
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
