<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瞄一眼 - 截图 3 (统计)</title>
    <style>
        :root {
            --harmony-brand: #007DFF;
            --harmony-bg: #F1F3F5;
            --harmony-card-bg: #FFFFFF;
            --harmony-font-primary: rgba(0, 0, 0, 0.9);
            --harmony-font-secondary: rgba(0, 0, 0, 0.6);
            --harmony-radius-lg: 32px;
            --fire-color: #FF6B00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "HarmonyHeiTi", "HarmonyOS Sans SC", sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #E0E0E0;
        }

        .screen {
            position: relative;
            width: 1080px;
            height: 2340px;
            background: var(--harmony-bg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transform: scale(0.3);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.2);
            border: 12px solid #333;
            border-radius: 60px;
        }

        .status-bar {
            height: 120px;
            padding: 0 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 42px;
        }

        .header {
            padding: 60px;
            font-size: 84px;
            font-weight: 700;
            color: var(--harmony-font-primary);
        }

        .streak-card {
            margin: 0 60px 60px;
            padding: 80px;
            background: var(--harmony-card-bg);
            border-radius: var(--harmony-radius-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .streak-fire {
            font-size: 200px;
            margin-bottom: 20px;
            color: var(--fire-color);
            filter: drop-shadow(0 10px 20px rgba(255, 107, 0, 0.3));
        }

        .streak-value {
            font-size: 140px;
            font-weight: 800;
            color: var(--harmony-font-primary);
        }

        .streak-label {
            font-size: 48px;
            color: var(--harmony-font-secondary);
            margin-top: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            padding: 0 60px 60px;
        }

        .mini-card {
            padding: 60px;
            background: var(--harmony-card-bg);
            border-radius: var(--harmony-radius-lg);
        }

        .mini-label { font-size: 36px; color: var(--harmony-font-secondary); margin-bottom: 12px; }
        .mini-value { font-size: 64px; font-weight: 700; color: var(--harmony-font-primary); }

        .heatmap-card {
            margin: 0 60px 60px;
            padding: 60px;
            background: var(--harmony-card-bg);
            border-radius: var(--harmony-radius-lg);
        }

        .heatmap-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 40px;
            font-size: 42px;
            font-weight: 600;
        }

        .heatmap-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 20px;
        }

        .heat-cell {
            aspect-ratio: 1;
            border-radius: 12px;
            background: #F1F3F5;
        }

        .heat-1 { background: #E3F2FD; }
        .heat-2 { background: #90CAF9; }
        .heat-3 { background: #42A5F5; }
        .heat-4 { background: #1E88E5; }
        .heat-5 { background: #1565C0; }

        .forecast-card {
            margin: 0 60px 60px;
            padding: 60px;
            background: var(--harmony-card-bg);
            border-radius: var(--harmony-radius-lg);
        }

        .chart-area {
            height: 300px;
            display: flex;
            align-items: flex-end;
            gap: 20px;
            margin-top: 40px;
        }

        .chart-bar {
            flex: 1;
            background: var(--harmony-brand);
            border-radius: 10px 10px 0 0;
            opacity: 0.6;
        }

        .chart-bar.active { opacity: 1; }
    </style>
</head>
<body>
    <div class="screen">
        <div class="status-bar">
            <span>9:41</span>
            <div style="display: flex; gap: 20px;">
                <span>📶</span>
                <span>🔋</span>
            </div>
        </div>

        <h1 class="header">学习统计</h1>

        <div class="streak-card">
            <div class="streak-fire">🔥</div>
            <div class="streak-value">128</div>
            <div class="streak-label">连续学习天数</div>
        </div>

        <div class="stats-grid">
            <div class="mini-card">
                <p class="mini-label">今日已学</p>
                <p class="mini-value">86</p>
            </div>
            <div class="mini-card">
                <p class="mini-label">累计掌握</p>
                <p class="mini-value">1,240</p>
            </div>
        </div>

        <div class="heatmap-card">
            <div class="heatmap-header">
                <span>学习热力图</span>
                <span style="color: var(--harmony-font-secondary); font-weight: 400;">最近 5 周</span>
            </div>
            <div class="heatmap-grid">
                <!-- Row 1 -->
                <div class="heat-cell heat-1"></div><div class="heat-cell heat-3"></div><div class="heat-cell heat-5"></div><div class="heat-cell heat-2"></div><div class="heat-cell heat-4"></div><div class="heat-cell heat-1"></div><div class="heat-cell heat-3"></div>
                <!-- Row 2 -->
                <div class="heat-cell heat-4"></div><div class="heat-cell heat-2"></div><div class="heat-cell heat-5"></div><div class="heat-cell heat-3"></div><div class="heat-cell heat-1"></div><div class="heat-cell heat-4"></div><div class="heat-cell heat-2"></div>
                <!-- Row 3 -->
                <div class="heat-cell heat-3"></div><div class="heat-cell heat-1"></div><div class="heat-cell heat-4"></div><div class="heat-cell heat-2"></div><div class="heat-cell heat-5"></div><div class="heat-cell heat-3"></div><div class="heat-cell heat-1"></div>
            </div>
        </div>

        <div class="forecast-card">
            <div class="heatmap-header">未来 7 天复习量预测</div>
            <div class="chart-area">
                <div class="chart-bar" style="height: 60%;"></div>
                <div class="chart-bar active" style="height: 90%;"></div>
                <div class="chart-bar" style="height: 40%;"></div>
                <div class="chart-bar" style="height: 75%;"></div>
                <div class="chart-bar" style="height: 55%;"></div>
                <div class="chart-bar" style="height: 85%;"></div>
                <div class="chart-bar" style="height: 30%;"></div>
            </div>
        </div>

        <div style="flex: 1;"></div>
        <div style="height: 120px; display: flex; justify-content: center; align-items: center;">
            <div style="width: 400px; height: 15px; background: rgba(0, 0, 0, 0.1); border-radius: 10px;"></div>
        </div>
    </div>
</body>
</html>
